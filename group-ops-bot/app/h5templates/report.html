<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>报数</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f6f6; color: #222; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 0;
         border-bottom: 1px solid #f0f0f0; }
  .row:last-child { border-bottom: none; }
  .row select { flex: 1; min-width: 0; padding: 8px; font-size: 14px;
                border: 1px solid #ddd; border-radius: 8px; background: #fff; }
  .row input.qty { width: 96px; padding: 8px; font-size: 14px; text-align: right;
                   border: 1px solid #ddd; border-radius: 8px; }
  .row .del { width: 32px; flex: none; border: none; background: none; color: #c5221f;
              font-size: 18px; line-height: 1; padding: 4px; cursor: pointer; }
  .row .del:disabled { color: #ccc; cursor: default; }
  .empty { color: #888; font-size: 13px; padding: 12px 0; text-align: center; }
  .add-btn { width: 100%; padding: 10px; border: 1px dashed #1a73e8; border-radius: 10px;
             font-size: 14px; margin-top: 10px; background: #fff; color: #1a73e8; }
  .add-btn:disabled { border-color: #ccc; color: #ccc; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px;
           font-size: 15px; margin-top: 10px; background: #1a73e8; color: #fff; }
  button:disabled { opacity: .5; }
  #status { font-size: 14px; line-height: 1.6; margin-top: 14px; white-space: pre-wrap; }
  .ok { color: #137333; }
  .warn { color: #b06000; }
  .err { color: #c5221f; }
  .verify-row { display: flex; gap: 8px; margin-top: 10px; }
  .verify-row input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
                      font-size: 15px; letter-spacing: 2px; }
  .verify-row button { width: auto; margin: 0; padding: 10px 16px; }
  .holder-name { color: #1a73e8; font-weight: 600; }
  #verifyMsg { font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>今日报数</h1>
  <div class="sub">按需添加本次要报的字段并填写数量（可添加多行）</div>

  <div class="card" id="verifyCard">
    <div class="sub" style="margin:0">
      此链接为「<span class="holder-name" id="holderName">该成员</span>」的专属链接，
      仅本人可提交报数。其他人请勿使用，请返回群聊告知本人操作。
    </div>
    <div class="verify-row">
      <input id="verifyInput" type="text" inputmode="numeric" maxlength="4"
             placeholder="本人手机号后 4 位" autocomplete="off">
      <button id="verifyBtn" type="button">验证身份</button>
    </div>
    <div id="verifyMsg" class="sub"></div>
  </div>

  <div class="card">
    <div id="fields"><div class="empty">字段加载中…</div></div>
    <button id="addBtn" class="add-btn" type="button" disabled>+ 添加报数字段</button>
  </div>

  <button id="submitBtn" type="button" disabled>提交报数</button>
  <div id="status"></div>
</div>

<script>
(function () {
  var hash = (location.hash || "").replace(/^#/, "");
  var token = "";
  hash.split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0 && kv.slice(0, i) === "t") {
      token = decodeURIComponent(kv.slice(i + 1));
    }
  });

  function $(id) { return document.getElementById(id); }
  function say(text, cls) {
    var el = $("status");
    el.textContent = text;
    el.className = cls || "";
  }
  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  var fields = [];        // 字段池（info 返回，全局共享）
  var rows = [];          // 已添加的行 { id, fieldId, qty }（唯一真源）
  var seq = 0;            // 行 id 自增（⛔ 不用数组下标，删行后下标会串）
  var verifyTail = "";    // 本人手机号后 4 位（身份绑定，服务端强制校验）
  var verified = false;

  function fieldLabel(f) {
    return f.unit ? (f.field_name + "（" + f.unit + "）") : f.field_name;
  }

  function showEmptyHint() {
    $("fields").innerHTML = '<div class="empty">点击下方「+ 添加报数字段」，按需添加要报的字段</div>';
  }

  function refreshSelects() {
    // 防重复：已被其他行选中的字段，在本行下拉里置灰（服务端仍会兜底拒绝）
    var sels = $("fields").querySelectorAll("select");
    Array.prototype.forEach.call(sels, function (select) {
      var chosen = select.value;
      var taken = [];
      Array.prototype.forEach.call(sels, function (other) {
        if (other !== select && other.value) { taken.push(other.value); }
      });
      Array.prototype.forEach.call(select.options, function (opt) {
        opt.disabled = opt.value !== "" && opt.value !== chosen &&
          taken.indexOf(opt.value) >= 0;
      });
    });
  }

  function refreshSubmitState() {
    var valid = rows.length > 0 && rows.every(function (row) {
      return row.fieldId !== "" && /^\d+$/.test(String(row.qty).trim());
    });
    $("submitBtn").disabled = !valid || !verified;
  }

  // ⭐ 2026-10-20 修复（用户报障：点删除不立即消失 / 点添加反而少一行）：
  // 旧实现把 DOM 节点和 rows 数组各改一半再互相 refresh，一旦某步抛错或
  // 顺序错位，两组状态就永久不一致 —— 于是「删了还在」「加了像删了」。
  // 现在改成**单一真源 + 整表重绘**：rows 是唯一状态，任何增删都 render()。
  function render() {
    var box = $("fields");
    if (!rows.length) { showEmptyHint(); refreshSubmitState(); return; }
    box.innerHTML = "";
    rows.forEach(function (row) {
      var rowEl = document.createElement("div");
      rowEl.className = "row";

      var select = document.createElement("select");
      var placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "请选择字段";
      select.appendChild(placeholder);
      fields.forEach(function (f) {
        var opt = document.createElement("option");
        opt.value = String(f.field_id);
        opt.textContent = fieldLabel(f);
        select.appendChild(opt);
      });
      select.value = row.fieldId;

      var qty = document.createElement("input");
      qty.type = "number";
      qty.className = "qty";
      qty.min = "0";
      qty.step = "1";
      qty.inputMode = "numeric";
      qty.placeholder = "数量";
      qty.value = row.qty;

      var del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.title = "删除本行";
      del.textContent = "×";
      del.setAttribute("data-del", String(row.id));

      select.addEventListener("change", function () {
        row.fieldId = select.value;
        refreshSelects();
        refreshSubmitState();
      });
      qty.addEventListener("input", function () {
        row.qty = qty.value;
        refreshSubmitState();
      });

      rowEl.appendChild(select);
      rowEl.appendChild(qty);
      rowEl.appendChild(del);
      box.appendChild(rowEl);
    });
    refreshSelects();
    refreshSubmitState();
  }

  function removeRow(id) {
    var next = [];
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].id !== id) { next.push(rows[i]); }
    }
    if (next.length === rows.length) { return; }   // 找不到 = 已删过，幂等
    rows = next;
    render();   // 立即重绘：点哪行删哪行，⛔ 不等到下一次操作才生效
  }

  function addRow() {
    if (rows.length >= 50) { say("一次最多添加 50 个字段。", "warn"); return; }
    rows.push({ id: ++seq, fieldId: "", qty: "" });
    render();
  }

  if (!token) {
    say("链接缺少凭证，请返回群聊重新发送「报数」。", "err");
    $("fields").innerHTML = "";
    return;
  }

  post("/api/h5/report/info", { token: token }).then(function (data) {
    if (!data.ok) {
      $("fields").innerHTML = "";
      say(data.message || "链接无效或已被作废，请重新发送「报数」。", "err");
      return;
    }
    if (data.done) {
      // ⭐ 修复：完成态也必须清掉「字段加载中…」占位（2026-10-16 用户报障）
      $("fields").innerHTML = '<div class="empty">今日报数已完成，无需重复提交。</div>';
      say("今日报数已完成，无需重复提交。", "ok");
      $("submitBtn").disabled = true;
      $("addBtn").disabled = true;
      return;
    }
    fields = data.fields || [];
    if (!fields.length) {
      $("fields").innerHTML = '<div class="empty">本群尚未配置报数字段，请联系管理员在后台维护。</div>';
      $("addBtn").disabled = true;
      return;
    }
    showEmptyHint();
    $("addBtn").disabled = true;   // 身份未确认前不许开始填写
    $("verifyMsg").textContent = "请先填写本人手机号后 4 位完成身份验证。";
    $("verifyMsg").className = "sub warn";
    if (data.holder_name) { $("holderName").textContent = data.holder_name; }
  }).catch(function () {
    $("fields").innerHTML = "";
    say("网络异常，请稍后重试。", "err");
  });

  $("verifyBtn").addEventListener("click", function () {
    var tail = ($("verifyInput").value || "").trim();
    if (!/^[0-9]{4}$/.test(tail)) {
      $("verifyMsg").textContent = "请填写 4 位数字（本人手机号后 4 位）。";
      $("verifyMsg").className = "sub warn";
      return;
    }
    verifyTail = tail;
    verified = true;
    $("addBtn").disabled = !fields.length;
    $("verifyMsg").textContent = "身份信息已填写，提交时由服务器核验（不匹配会被拒绝）。";
    $("verifyMsg").className = "sub ok";
    refreshSubmitState();
  });

  $("addBtn").addEventListener("click", addRow);

  // 删除走**事件委托**（⭐ 2026-10-20）：监听器挂在容器上，不随重绘丢失；
  // 认 data-del 行 id 删除，⛔ 不再依赖闭包里那条可能已经失效的 DOM 引用。
  $("fields").addEventListener("click", function (ev) {
    var node = ev.target;
    while (node && node !== this) {
      if (node.getAttribute && node.getAttribute("data-del")) {
        ev.preventDefault();
        ev.stopPropagation();
        removeRow(parseInt(node.getAttribute("data-del"), 10));
        return;
      }
      node = node.parentNode;
    }
  });

  $("submitBtn").addEventListener("click", function () {
    var items = [];
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row.fieldId) {
        say("第 " + (i + 1) + " 行还没选择字段，请选择或删除该行。", "warn");
        return;
      }
      var raw = String(row.qty).trim();
      if (!/^\d+$/.test(raw)) {
        say("数量必须是不小于 0 的整数，请检查第 " + (i + 1) + " 行。", "warn");
        return;
      }
      items.push({ field_id: parseInt(row.fieldId, 10),
                   quantity: parseInt(raw, 10) });
    }
    if (!items.length) { say("请至少添加一个要报的字段。", "warn"); return; }
    if (!verified) { say("请先填写本人手机号后 4 位完成身份核验。", "warn"); return; }
    say("正在提交…", "");
    // ⛔ 不再发送 role（2026-10-16 去角色化：角色由服务端派生）
    post("/api/h5/report/submit",
         { token: token, items: items, verify: verifyTail })
      .then(function (data) {
        say(data.message || "", data.ok ? "ok" : (data.kind === "C" ? "warn" : "err"));
        if (data.ok) {
          $("submitBtn").disabled = true;
          $("addBtn").disabled = true;
        }
        if (data && data.reason === "holder_mismatch") {
          verified = false;
          verifyTail = "";
          $("addBtn").disabled = true;
          $("verifyMsg").textContent = data.message || "身份不匹配，仅链接本人可提交。";
          $("verifyMsg").className = "sub err";
        }
      })
      .catch(function () { say("提交失败，请稍后重试。", "err"); });
  });
})();
</script>
</body>
</html>
