<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改初始密码 · 群运维机器人管理后台</title>
<link rel="stylesheet" href="/static/css/tabler.min.css">
<link rel="stylesheet" href="/static/css/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/admin.css">
{% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
</head>
<body class="d-flex flex-column" data-page="changepw">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="/" class="navbar-brand navbar-brand-autodark">
        <img src="/static/images/logo.svg" alt="群运维机器人" height="36">
      </a>
    </div>
    <form class="card card-md shadow-sm" action="#" method="post" autocomplete="off" id="changepw-form">
      <div class="card-body">
        <h2 class="card-title text-center mb-1">修改初始密码</h2>
        <p class="text-muted text-center mb-4">首次登录必须将初始密码改为正式密码；修改后需重新登录。</p>
        <div class="mb-3">
          <label class="form-label" for="cpw-old">当前密码（初始凭据）</label>
          <input type="password" class="form-control" id="cpw-old"
                 autocomplete="current-password" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="cpw-new">新密码（至少 8 位）</label>
          <input type="password" class="form-control" id="cpw-new"
                 autocomplete="new-password" minlength="8" required>
        </div>
        <div class="alert alert-danger d-none mt-3" id="cpw-error" role="alert"></div>
        <div class="form-footer mt-3">
          <button type="submit" class="btn btn-primary w-100" id="cpw-btn">确认修改并重新登录</button>
        </div>
      </div>
    </form>
  </div>
</div>
<script src="/static/js/tabler.min.js"></script>
<script src="/static/js/admin-core.js"></script>
<script src="/static/js/admin-pages.js"></script>
</body>
</html>
