<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 群运维机器人管理后台</title>
<link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tabler.min.css">
<link rel="stylesheet" href="/static/css/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="d-flex flex-column" data-page="login">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="/login" class="navbar-brand navbar-brand-autodark">
        <img src="/static/images/logo.svg" alt="群运维机器人" height="36">
      </a>
    </div>
    <form class="card card-md shadow-sm needs-validation" action="#" method="post"
          autocomplete="off" id="login-form" novalidate>
      <div class="card-body">
        <h2 class="card-title text-center mb-4">管理后台登录</h2>
        <div class="mb-3">
          <label class="form-label" for="login-username">用户名</label>
          <input type="text" class="form-control" id="login-username"
                 name="username" autocomplete="username" placeholder="请输入用户名" required>
          <div class="invalid-feedback">请填写用户名</div>
        </div>
        <div class="mb-2">
          <label class="form-label" for="login-password">密码</label>
          <input type="password" class="form-control" id="login-password"
                 name="password" autocomplete="current-password"
                 placeholder="请输入密码" required minlength="1">
          <div class="invalid-feedback">请填写密码</div>
        </div>
        <div class="alert alert-danger d-none mt-3" id="login-error" role="alert"></div>
        <div class="form-footer mt-3">
          <button type="submit" class="btn btn-primary w-100" id="login-btn">登 录</button>
        </div>
      </div>
    </form>
    <div class="text-center text-muted mt-3">
      仅限内网访问；连续输错 5 次将锁定 15 分钟
    </div>
  </div>
</div>
<script src="/static/js/tabler.min.js"></script>
<script src="/static/js/admin-core.js"></script>
<script src="/static/js/admin-pages.js"></script>
</body>
</html>
