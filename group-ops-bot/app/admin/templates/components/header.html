{# 顶部状态栏（Tabler navbar；浅色主题）。登出走 admin-core.js 的 fetch。 #}
<header class="navbar navbar-expand-md navbar-light d-none d-lg-flex d-print-none">
  <div class="container-xl">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#sidebar-menu" aria-controls="sidebar-menu"
            aria-expanded="false" aria-label="切换菜单">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-nav flex-row order-md-last ms-auto">
      <div class="nav-item dropdown">
        <a href="#" class="nav-link d-flex lh-1 text-reset p-0"
           data-bs-toggle="dropdown" aria-label="打开用户菜单">
          <span class="avatar avatar-sm avatar-rounded"
                style="background-color: var(--tblr-primary); color: #fff;">
            {{ (username or 'A')[:1] }}
          </span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ username }}</div>
            <div class="mt-1 small text-muted">管理员</div>
          </div>
        </a>
        <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
          <a class="dropdown-item" href="/system">系统设置</a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-danger" type="button" id="logout-btn">退出登录</button>
        </div>
      </div>
    </div>
  </div>
</header>
